services:
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.10.0
    network_mode: "host"
      #ports:
      #  - "53:53/tcp"
      #  - "53:53/udp"
      #  - "67:67/udp"
      #  - "8080:80/tcp"
      #  - "8443:443/tcp"
    environment:
      TZ: 'America/Detroit'
      FTLCONF_webserver_api_password: 'M9XVjDrFGV5dbdEwg7'
      FTLCONF_LOCAL_IPV4: '192.168.0.5'
      FTLCONF_dns_listeningMode: 'ALL'
      FTLCONF_webserver_port: '8080'
    volumes:
      - './etc-pihole:/etc/pihole'
      - './etc-dnsmasq.d:/etc/dnsmasq.d'
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    restart: unless-stopped
